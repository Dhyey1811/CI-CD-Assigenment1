name: ci-pipeline-dhyey-8965482

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run Unit Tests
        run: pytest app/test_converter.py

      - name: Build Docker Image
        run: docker build -t temp-converter .

      - name: Run Docker Container
        run: |
          docker run -d --name temp-container temp-converter
          sleep 3
          docker ps

      - name: Stop and Remove Container
        run: |
          docker stop temp-container
          docker rm temp-container
